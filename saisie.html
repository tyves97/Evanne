<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saisie — Suivi Enrôlement CNU</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F3D3E">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ============================================================
   SUIVI ENRÔLEMENT CNU — Design system
   Palette: vert institutionnel + or, esprit "carte d'identité"
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --teal-950: #0B2E2E;
  --teal-900: #0F3D3E;
  --teal-700: #1C5F5B;
  --teal-500: #2E8078;
  --teal-100: #E4EFEC;

  --gold-600: #B9871E;
  --gold-500: #D9A62E;
  --gold-100: #FBF0D6;

  --clay-600: #C1512E;
  --clay-100: #F7E3D8;

  --paper: #F6F4EE;
  --surface: #FFFFFF;
  --ink: #1E2422;
  --ink-soft: #4B5551;
  --muted: #8A9490;
  --line: #E1DDD1;

  --ok: #2F8F5B;
  --warn: #C1512E;
  --danger: #A6362B;

  --radius-card: 14px;
  --radius-chip: 10px;
  --shadow-1: 0 1px 2px rgba(15,61,62,.06), 0 6px 20px -8px rgba(15,61,62,.18);
  --shadow-2: 0 2px 6px rgba(15,61,62,.10), 0 16px 40px -16px rgba(15,61,62,.28);

  --font-display: 'Fraunces', serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family: var(--font-body);
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

/* faint perforation texture on the paper, like a tear-off enrolment slip */
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image: radial-gradient(circle, rgba(15,61,62,.05) 1px, transparent 1.4px);
  background-size: 14px 14px;
  opacity:.5;
}

a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; }

/* ---------------- App shell ---------------- */
.app-shell{
  position:relative; z-index:1;
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:230px; flex-shrink:0;
  background: var(--teal-950);
  color: #EFF6F3;
  display:flex; flex-direction:column;
  padding: 22px 16px;
  position: sticky; top:0; height:100vh;
}

.brand{
  display:flex; align-items:center; gap:10px;
  padding: 4px 6px 20px;
  border-bottom: 1px solid rgba(255,255,255,.12);
  margin-bottom: 18px;
}
.brand-mark{
  width:34px; height:34px; border-radius:8px;
  background: linear-gradient(155deg, var(--gold-500), var(--clay-600));
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-display); font-weight:700; color:var(--teal-950);
  font-size:15px; flex-shrink:0;
}
.brand-text{ line-height:1.15; }
.brand-text .eyebrow{ display:block; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color: var(--gold-500); font-weight:600; }
.brand-text .title{ display:block; font-family: var(--font-display); font-weight:600; font-size:15px; margin-top:2px; }

.nav-group{ margin-bottom: 22px; }
.nav-label{ font-size:10px; letter-spacing:.14em; text-transform:uppercase; color: rgba(239,246,243,.45); padding: 0 10px 8px; }
.nav-link{
  display:flex; align-items:center; gap:10px;
  padding: 10px 10px;
  border-radius: 9px;
  font-size: 13.5px; font-weight:500;
  color: rgba(239,246,243,.82);
  margin-bottom:2px;
  transition: background .15s ease, color .15s ease;
}
.nav-link .ic{ width:17px; text-align:center; flex-shrink:0; opacity:.9; }
.nav-link:hover{ background: rgba(255,255,255,.06); color:#fff; }
.nav-link.active{ background: var(--teal-700); color:#fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }

.sidebar-foot{
  margin-top:auto;
  padding-top: 16px;
  border-top: 1px solid rgba(255,255,255,.12);
  display:flex; align-items:center; gap:9px;
}
.sidebar-foot img{ height:22px; width:auto; filter: brightness(0) invert(1); opacity:.75; }
.sidebar-foot .cap{ font-size:10.5px; color: rgba(239,246,243,.5); line-height:1.3; }

.main{
  flex:1; min-width:0;
  display:flex; flex-direction:column;
}

.topbar{
  display:flex; align-items:center; justify-content:space-between;
  gap:16px; flex-wrap:wrap;
  padding: 20px 32px;
  border-bottom: 1px solid var(--line);
  background: rgba(246,244,238,.85);
  backdrop-filter: blur(6px);
  position: sticky; top:0; z-index:5;
}
.topbar h1{
  font-family: var(--font-display); font-weight:600;
  font-size: 22px; margin:0; color: var(--teal-950);
}
.topbar .sub{ font-size:12.5px; color: var(--muted); margin-top:3px; }
.topbar-right{ display:flex; align-items:center; gap:10px; }
.date-pill{
  font-family: var(--font-mono); font-size:12px; font-weight:600;
  background: var(--surface); border:1px solid var(--line); border-radius: 999px;
  padding: 7px 14px; color: var(--teal-900);
}

.content{ padding: 26px 32px 60px; }

/* ---------------- Buttons ---------------- */
.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding: 10px 18px; border-radius: 10px; border:none; cursor:pointer;
  font-size: 13.5px; font-weight:600; transition: transform .12s ease, box-shadow .12s ease, background .15s ease;
}
.btn:active{ transform: translateY(1px); }
.btn-primary{ background: var(--teal-900); color:#fff; box-shadow: var(--shadow-1); }
.btn-primary:hover{ background: var(--teal-700); }
.btn-gold{ background: var(--gold-500); color: var(--teal-950); box-shadow: var(--shadow-1); }
.btn-gold:hover{ background: #c99722; }
.btn-ghost{ background: transparent; color: var(--teal-900); border:1px solid var(--line); }
.btn-ghost:hover{ background: var(--teal-100); }
.btn-danger{ background: var(--clay-100); color: var(--danger); }
.btn-danger:hover{ background: #f1cfbe; }
.btn-sm{ padding: 6px 12px; font-size:12px; border-radius:8px; }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }

/* ---------------- Cards / chips ---------------- */
.card{
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-1);
}
.card-pad{ padding: 20px 22px; }

/* signature stat chip — cut corner like a die-cut ID card */
.id-chip{
  position:relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: 16px 18px 14px;
  clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
  box-shadow: var(--shadow-1);
  overflow:hidden;
}
.id-chip::after{
  content:"";
  position:absolute; top:0; right:0; width:16px; height:16px;
  background: var(--gold-500);
}
.id-chip .num{ font-family: var(--font-display); font-weight:600; font-size: 30px; color: var(--teal-950); line-height:1; }
.id-chip .lbl{ font-size: 11px; letter-spacing:.06em; text-transform:uppercase; color: var(--muted); margin-top:8px; font-weight:600; }
.id-chip .code{ position:absolute; bottom:10px; right:14px; font-family: var(--font-mono); font-size:10px; color: var(--muted); opacity:.7; }
.id-chip.accent-gold .num{ color: var(--gold-600); }
.id-chip.accent-clay .num{ color: var(--clay-600); }
.id-chip.accent-teal .num{ color: var(--teal-700); }

.stat-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; }
@media (max-width: 1100px){ .stat-grid{ grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px){ .stat-grid{ grid-template-columns: 1fr 1fr; } }

/* dashed perforation divider — nods to a tear-off enrolment slip */
.perf{
  border:none; height:0; margin: 26px 0;
  border-top: 2px dashed var(--line);
  position:relative;
}
.perf::before, .perf::after{
  content:""; position:absolute; top:-7px; width:14px; height:14px; border-radius:50%;
  background: var(--paper); border:1px solid var(--line);
}
.perf::before{ left:-32px; } .perf::after{ right:-32px; }

.section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
.section-head h2{ font-family: var(--font-display); font-size:17px; font-weight:600; color:var(--teal-950); margin:0; }
.section-head .hint{ font-size:12px; color: var(--muted); }

/* ---------------- Filter pills ---------------- */
.filter-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.pill{
  padding: 7px 14px; border-radius:999px; font-size:12.5px; font-weight:600;
  background: var(--surface); border:1px solid var(--line); color: var(--ink-soft); cursor:pointer;
}
.pill.active{ background: var(--teal-900); color:#fff; border-color: var(--teal-900); }

/* ---------------- Forms ---------------- */
.form-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-card); box-shadow: var(--shadow-1); padding: 24px 26px; }
.form-block-title{
  display:flex; align-items:center; gap:9px;
  font-family: var(--font-mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase;
  color: var(--teal-700); font-weight:600; margin: 22px 0 12px;
}
.form-block-title:first-child{ margin-top:0; }
.form-block-title .dot{ width:7px; height:7px; border-radius:50%; background: var(--gold-500); }

.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.grid-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
@media (max-width: 760px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }

.field label{ display:block; font-size:12px; font-weight:600; color: var(--ink-soft); margin-bottom:6px; }
.field input[type=text], .field input[type=tel], .field input[type=date], .field select, .field textarea{
  width:100%; padding: 10px 12px; border-radius:9px; border:1px solid var(--line);
  background: var(--paper); font-family: var(--font-body); font-size:13.5px; color: var(--ink);
}
.field textarea{ resize:vertical; min-height:64px; }
.field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--teal-500); outline-offset:1px; background:#fff; }

.radio-row, .check-grid{ display:flex; flex-wrap:wrap; gap:8px; }
.chip-option{
  display:flex; align-items:center; gap:7px;
  padding: 9px 13px; border-radius:9px; border:1px solid var(--line); background:var(--paper);
  font-size:13px; cursor:pointer; user-select:none;
}
.chip-option input{ accent-color: var(--teal-900); }
.chip-option:has(input:checked){ background: var(--teal-100); border-color: var(--teal-500); color: var(--teal-950); font-weight:600; }

/* ---------------- Aperçu fiche (carte d'identité) ---------------- */
.saisie-grid{ display:grid; grid-template-columns: minmax(0,1fr) 320px; gap:22px; align-items:start; }
.preview-card{ position:sticky; top:96px; }
.id-card-preview{
  background: linear-gradient(135deg, #EB7C33, #D35F1F);
  border-radius:20px; padding: 20px 18px 16px; color:#fff; position:relative; overflow:hidden;
  box-shadow: var(--shadow-2);
  min-height:220px;
}
.id-card-preview::after{
  content:""; position:absolute; bottom:-46px; left:-30px; width:150px; height:150px;
  border-radius:50%; background: rgba(255,255,255,.06);
}
.idc-topband{
  position:absolute; top:16px; left:0; z-index:2;
  background:#fff; color: var(--clay-600); font-weight:700; font-size:10.5px; letter-spacing:.02em;
  padding:7px 16px 7px 18px; border-radius:0 999px 999px 0;
  box-shadow:0 4px 12px rgba(0,0,0,.18);
}
.idc-body{ display:flex; gap:14px; align-items:flex-start; position:relative; z-index:1; margin-top:38px; }
.idc-photo{ width:58px; height:72px; border-radius:8px; background: rgba(255,255,255,.22); border:2px solid rgba(255,255,255,.55); flex-shrink:0; position:relative; overflow:hidden; }
.idc-photo::after{ content:""; position:absolute; left:50%; bottom:-8px; transform:translateX(-50%); width:42px; height:28px; border-radius:50% 50% 0 0; background: rgba(255,255,255,.35); }
.idc-photo::before{ content:""; position:absolute; left:50%; top:13px; transform:translateX(-50%); width:19px; height:19px; border-radius:50%; background: rgba(255,255,255,.35); }
.idc-fields{ min-width:0; flex:1; display:flex; flex-direction:column; gap:6px; padding-top:2px; }
.idc-field{ display:flex; align-items:baseline; gap:7px; font-size:11.5px; line-height:1.3; }
.idc-field .arrow{ color:#fff; opacity:.8; font-weight:700; flex-shrink:0; }
.idc-field b{ font-family: var(--font-mono); font-weight:700; overflow-wrap:anywhere; }
.idc-foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; position:relative; z-index:1; margin-top:16px; }
.idc-qr{
  width:38px; height:38px; border-radius:7px; flex-shrink:0;
  background-color: rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.4);
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.55) 0 2.5px, transparent 2.5px 6px);
}
.idc-badges{ display:flex; flex-wrap:wrap; gap:5px; justify-content:flex-end; }
.idc-pill{ font-family: var(--font-mono); font-size:9.5px; font-weight:600; letter-spacing:.03em; padding:3px 8px; border-radius:6px; background: rgba(255,255,255,.24); color:#fff; }
.idc-pill-empty{ background: rgba(255,255,255,.13); color: rgba(255,255,255,.75); font-family: var(--font-body); font-weight:500; }
.preview-hint{ font-size:11px; color: var(--muted); margin-top:10px; text-align:center; }
@media (max-width: 1000px){
  .saisie-grid{ grid-template-columns:1fr; }
  .preview-card{ position:static; order:-1; max-width:360px; }
}

/* ---------------- Tables ---------------- */
.table-wrap{ overflow-x:auto; border-radius: var(--radius-card); border:1px solid var(--line); }
table{ width:100%; border-collapse:collapse; background:var(--surface); font-size:13px; }
thead th{
  text-align:left; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
  color: var(--muted); font-weight:700; padding: 12px 14px; background: var(--teal-100);
  border-bottom:1px solid var(--line); white-space:nowrap;
}
tbody td{ padding: 11px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
tbody tr:last-child td{ border-bottom:none; }
tbody tr:hover{ background: var(--paper); }
.badge{
  font-family: var(--font-mono); font-size:10.5px; font-weight:600; letter-spacing:.03em;
  padding: 3px 8px; border-radius:6px; display:inline-block;
}
.badge-enr{ background:#E4F1E9; color:var(--ok); }
.badge-cnu{ background: var(--gold-100); color: var(--gold-600); }
.badge-snd{ background:#EDEDED; color:#555; }
.badge-warn{ background: var(--clay-100); color: var(--warn); }
.badge-danger{ background:#F3E0DD; color:var(--danger); }

/* ---------------- Empty state ---------------- */
.empty{
  text-align:center; padding: 50px 20px; color: var(--muted);
}
.empty .glyph{ font-size:30px; margin-bottom:10px; }
.empty p{ margin:4px 0; font-size:13px; }

/* ---------------- Report list ---------------- */
.report-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:14px; }
@media (max-width: 900px){ .report-grid{ grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px){ .report-grid{ grid-template-columns: 1fr; } }
.report-card{
  background:var(--surface); border:1px solid var(--line); border-radius: var(--radius-card);
  padding: 18px; cursor:pointer; transition: box-shadow .15s ease, border-color .15s ease;
}
.report-card:hover{ box-shadow: var(--shadow-2); border-color: var(--teal-500); }
.report-card.selected{ border-color: var(--teal-900); box-shadow: 0 0 0 2px var(--teal-100); }
.report-card .ic{ font-size:20px; }
.report-card .name{ font-family: var(--font-display); font-weight:600; font-size:15px; margin: 8px 0 3px; color: var(--teal-950); }
.report-card .desc{ font-size:12px; color: var(--muted); }

.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background: var(--teal-950); color:#fff; padding: 12px 20px; border-radius:10px;
  font-size:13px; font-weight:600; box-shadow: var(--shadow-2); z-index:50;
  opacity:0; pointer-events:none; transition: opacity .2s ease, transform .2s ease;
}
.toast.show{ opacity:1; transform: translateX(-50%) translateY(-6px); }

/* Hero strip on dashboard, echoes the ID card motif */
.hero{
  position:relative; overflow:hidden;
  border-radius: var(--radius-card);
  background: linear-gradient(120deg, var(--teal-950) 0%, var(--teal-700) 100%);
  color:#fff; padding: 26px 28px; margin-bottom:20px;
  display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
}
.hero .htext .eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color: var(--gold-500); font-weight:700; }
.hero .htext h1{ font-family: var(--font-display); font-weight:600; font-size:24px; margin: 6px 0 4px; }
.hero .htext p{ font-size:13px; color: rgba(255,255,255,.75); margin:0; max-width:440px; }
.hero-card-photo{
  width:120px; height:76px; border-radius:8px; overflow:hidden; flex-shrink:0;
  box-shadow: 0 10px 26px rgba(0,0,0,.35); transform: rotate(-4deg);
  border:2px solid rgba(255,255,255,.5);
}
.hero-card-photo img{ width:100%; height:100%; object-fit:cover; }

/* ---------------- Menu mobile (tiroir) ---------------- */
.topbar-left{ display:flex; align-items:center; gap:12px; }
.hamburger{
  display:none; flex-direction:column; justify-content:center; gap:4px;
  width:36px; height:36px; border:1px solid var(--line); border-radius:9px;
  background: var(--surface); cursor:pointer; flex-shrink:0;
}
.hamburger span{ display:block; width:16px; height:2px; margin:0 auto; background: var(--teal-950); border-radius:2px; }
.sidebar-close{ display:none; margin-left:auto; background:none; border:none; color:#fff; font-size:22px; line-height:1; cursor:pointer; opacity:.7; }
.sidebar-close:hover{ opacity:1; }
.nav-backdrop{ display:none; position:fixed; inset:0; background: rgba(11,46,46,.5); z-index:19; opacity:0; transition:opacity .2s ease; }
.nav-backdrop.show{ display:block; opacity:1; }

/* ---------------- Bouton d'installation ---------------- */
.install-btn{ display:inline-flex; align-items:center; gap:6px; }
.install-btn .ic{ font-size:13px; }
.install-btn.ready{ animation: installPulse 1.8s ease-in-out 2; }
@keyframes installPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(217,166,46,.5);} 50%{ box-shadow:0 0 0 6px rgba(217,166,46,0);} }

/* ---------------- Ecran de lancement anime ---------------- */
.app-splash{
  position:fixed; inset:0; z-index:100;
  background: linear-gradient(160deg, var(--teal-950), var(--teal-700));
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  transition: opacity .5s ease, visibility .5s ease;
}
.app-splash.hide{ opacity:0; visibility:hidden; pointer-events:none; }
.splash-mark{
  width:64px; height:64px; border-radius:16px;
  background: linear-gradient(155deg, var(--gold-500), var(--clay-600));
  color: var(--teal-950); font-family: var(--font-display); font-weight:700; font-size:26px;
  display:flex; align-items:center; justify-content:center;
  animation: splashPop .7s cubic-bezier(.22,1,.36,1) both;
  box-shadow: 0 14px 34px rgba(0,0,0,.35);
}
.splash-title{
  font-family: var(--font-mono); letter-spacing:.14em; font-size:12px; color: rgba(255,255,255,.85);
  animation: splashFade .6s ease .15s both;
}
.splash-bar{ width:120px; height:3px; border-radius:3px; background: rgba(255,255,255,.15); overflow:hidden; animation: splashFade .6s ease .2s both; }
.splash-bar span{ display:block; height:100%; width:40%; background: var(--gold-500); border-radius:3px; animation: splashLoad 1.1s ease-in-out infinite; }
@keyframes splashPop{ from{ opacity:0; transform: scale(.6) rotate(-8deg);} to{ opacity:1; transform:scale(1) rotate(0);} }
@keyframes splashFade{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }
@keyframes splashLoad{ 0%{ transform:translateX(-100%);} 50%{ transform:translateX(60%);} 100%{ transform:translateX(220%);} }
@media (prefers-reduced-motion: reduce){
  .splash-mark, .splash-title, .splash-bar, .splash-bar span, .install-btn.ready{ animation:none !important; }
}

@media (max-width: 900px){
  .sidebar{
    display:flex; position:fixed; left:0; top:0; height:100vh; z-index:20; width:250px;
    transform: translateX(-100%); transition: transform .25s ease;
    box-shadow: 10px 0 30px rgba(0,0,0,.3);
  }
  .sidebar.open{ transform: translateX(0); }
  .sidebar-close{ display:inline-block; }
  .hamburger{ display:flex; }
  .content{ padding: 20px 16px 50px; }
  .topbar{ padding: 14px 16px; }
  .grid-3{ grid-template-columns:1fr 1fr; }
  .date-pill{ display:none; }
}
@media (max-width: 480px){
  .topbar h1{ font-size:18px; }
  .install-btn{ padding:8px 12px; font-size:12px; }
}

</style>
</head>
<body>
<div class="app-shell" id="shell"></div>

<script>
/* ============================================================

function sousPrefectureDe(localite){
  for(const sp of SOUS_PREFECTURES){ if(LOCALITES_PAR_SP[sp].includes(localite)) return sp; }
  return '';
}
const AGENTS = ['KONATE Kady Evanne','YAPO Doris'];

function todayISO(){ return new Date().toISOString().slice(0,10); }

function seedData(){
  const rows = [];
  const noms = ['KOUASSI','TRAORÉ','BAMBA','KONE','OUATTARA','YAO','DIALLO','GNAGNE','ADJOBI','SORO'];
  const prenoms = ['Jean','Aminata','Yves','Fatou','Kady','Marie','Souleymane','Adjoua','Issa','Aya'];
  let id = 1; // ids de démo, distincts des ids réels (F...)
  const rand = (arr)=>arr[Math.floor(Math.random()*arr.length)];
  const daysBack = [0,0,0,1,1,2,3,4,6,9,14,20,27];
  daysBack.forEach((d)=>{
    const n = 4 + Math.floor(Math.random()*5);
    for(let i=0;i<n;i++){
      const date = new Date(Date.now() - d*86400000).toISOString().slice(0,10);
      const seedSP = rand(SOUS_PREFECTURES);
      const seedLocalite = rand(LOCALITES_PAR_SP[seedSP]);
      const situations = [];
      const r = Math.random();
      if(r < 0.6){ situations.push('ENR'); if(Math.random()<0.25) situations.push('CNU'); else if(Math.random()<0.3) situations.push('DA'); else if(Math.random()<0.25) situations.push('SND'); }
      else if(r < 0.7) situations.push('PD');
      else if(r < 0.78) situations.push('PI');
      else if(r < 0.83) situations.push('DEC');
      else if(r < 0.9) situations.push('NJ');
      else if(r < 0.95) situations.push('REF');
      else situations.push('ENR');
      if(Math.random()<0.12) situations.push('VUL');
      rows.push({
        id: 'seed-'+(id++),
        nom: rand(noms), prenoms: rand(prenoms), sexe: Math.random()<0.5?'M':'F',
        telephone: '07'+Math.floor(10000000+Math.random()*89999999),
        localite: seedLocalite, sousPrefecture: seedSP, equipe: rand(EQUIPES), agent: rand(AGENTS),
        date, typePiece: situations.includes('SND') ? 'Aucun document' : rand(TYPES_PIECES),
        numeroPiece: situations.includes('SND') ? '' : String(Math.floor(100000+Math.random()*900000)),
        situations, observation:''
      });
    }
  });
  return rows;
}

function loadStore(){
  let raw;
  try{ raw = JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){ raw = null; }
  if(!raw || !Array.isArray(raw.personnes)){
    raw = { personnes: seedData() };
    localStorage.setItem(STORE_KEY, JSON.stringify(raw));
  }
  return raw;
}

function saveStore(store){
  localStorage.setItem(STORE_KEY, JSON.stringify(store));
}

function makeId(){
  return 'F' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function addPersonne(entry){
  const store = loadStore();
  entry.id = makeId();
  store.personnes.unshift(entry);
  saveStore(store);
  return entry;
}

function deletePersonne(id){
  const store = loadStore();
  store.personnes = store.personnes.filter(p=>p.id!==id);
  saveStore(store);
}

function resetData(){
  localStorage.removeItem(STORE_KEY);
  return loadStore();
}

/* ---------- filtrage période ---------- */
function inPeriod(dateStr, period){
  const d = new Date(dateStr+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  if(period==='today') return dateStr === todayISO();
  if(period==='week'){
    const day = (now.getDay()+6)%7; // lundi=0
    const monday = new Date(now); monday.setDate(now.getDate()-day);
    return d >= monday;
  }
  if(period==='month'){
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  }
  return true; // 'all'
}

function filterRows(rows, filters){
  return rows.filter(r=>{
    if(filters.period && filters.period!=='all' && !inPeriod(r.date, filters.period)) return false;
    if(filters.q){
      const hay = (r.nom+' '+r.prenoms+' '+r.telephone).toLowerCase();
      if(!hay.includes(filters.q.toLowerCase())) return false;
    }
    if(filters.sousPrefecture && r.sousPrefecture !== filters.sousPrefecture) return false;
    if(filters.localite && r.localite !== filters.localite) return false;
    if(filters.equipe && r.equipe !== filters.equipe) return false;
    if(filters.agent && r.agent !== filters.agent) return false;
    if(filters.typePiece && r.typePiece !== filters.typePiece) return false;
    if(filters.situation && !r.situations.includes(filters.situation)) return false;
    if(filters.dateFrom && r.date < filters.dateFrom) return false;
    if(filters.dateTo && r.date > filters.dateTo) return false;
    return true;
  });
}

function computeStats(rows){
  const s = { total: rows.length };
  SITUATIONS.forEach(sit=>{ s[sit.code] = rows.filter(r=>r.situations.includes(sit.code)).length; });
  return s;
}

function situationBadge(code){
  const s = SITUATIONS.find(x=>x.code===code);
  if(!s) return `<span class="badge badge-snd">${code}</span>`;
  return `<span class="badge ${s.cls}">${s.code}</span>`;
}

/* ---------- Service worker (installation PWA hors-ligne) ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

/* ---------- Ecran de lancement anime ---------- */
(function initSplash(){
  if(document.getElementById('appSplash')) return;
  const el = document.createElement('div');
  el.id = 'appSplash';
  el.className = 'app-splash';
  el.innerHTML = '<div class="splash-mark">CI</div><div class="splash-title">SUIVI ENR\u00d4LEMENT CNU</div><div class="splash-bar"><span></span></div>';
  document.body.appendChild(el);
})();

function dismissSplash(){
  const el = document.getElementById('appSplash');
  if(!el) return;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(()=>{
    el.classList.add('hide');
    setTimeout(()=>el.remove(), 500);
  }, reduce ? 60 : 650);
}

/* ---------- Installation (PWA) ---------- */
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  window.__deferredInstallPrompt = e;
  const btn = document.getElementById('installBtn');
  if(btn) btn.classList.add('ready');
});
window.addEventListener('appinstalled', ()=>{
  const btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'none';
  showToast('Application installee \u2713');
});

/* ---------- Cablage du menu mobile + installation, a appeler apres le rendu du shell ---------- */
function afterShellMount(){
  const ham = document.getElementById('hamburgerBtn');
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('navBackdrop');
  const closeBtn = document.getElementById('sidebarClose');
  function openNav(){ sidebar.classList.add('open'); backdrop.classList.add('show'); }
  function closeNav(){ sidebar.classList.remove('open'); backdrop.classList.remove('show'); }
  if(ham) ham.addEventListener('click', openNav);
  if(backdrop) backdrop.addEventListener('click', closeNav);
  if(closeBtn) closeBtn.addEventListener('click', closeNav);
  document.querySelectorAll('.nav-link').forEach(l=>l.addEventListener('click', closeNav));

  const installBtn = document.getElementById('installBtn');
  if(installBtn){
    installBtn.addEventListener('click', async ()=>{
      const evt = window.__deferredInstallPrompt;
      if(evt){
        evt.prompt();
        const choice = await evt.userChoice;
        window.__deferredInstallPrompt = null;
        if(choice.outcome === 'accepted') showToast('Installation en cours\u2026');
      } else {
        showToast('Menu du navigateur \u2192 \u00ab Ajouter a l\u2019ecran d\u2019accueil / Installer l\u2019application \u00bb');
      }
    });
  }
  dismissSplash();
}

function showToast(msg){
  let t = document.querySelector('.toast');
  if(!t){ t = document.createElement('div'); t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2400);
}

function esc(str){
  return String(str??'').replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

document.getElementById('shell').innerHTML = renderShell('saisie.html', 'Nouvelle fiche', 'Une ligne = une personne. Les bilans se calculent tout seuls.');
afterShellMount();

const situationChips = SITUATIONS.map(s=>`
  <label class="chip-option">
    <input type="checkbox" name="situation" value="${s.code}">
    ${s.label}
  </label>`).join('');

document.getElementById('content').innerHTML = `
<div class="saisie-grid">
  <div class="form-card">
    <form id="ficheForm">

      <div class="form-block-title"><span class="dot"></span>Mission</div>
      <div class="grid-3">
        <div class="field"><label>Équipe</label>
          <select name="equipe">${EQUIPES.map(e=>`<option>${e}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Commune / Sous-préfecture</label>
          <select name="sousPrefecture" id="spSelect">${SOUS_PREFECTURES.map(sp=>`<option>${sp}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Agent</label>
          <select name="agent">${AGENTS.map(a=>`<option>${a}</option>`).join('')}</select>
        </div>
      </div>
      <div class="grid-3">
        <div class="field"><label>Localité</label>
          <select name="localite" id="localiteSelect"></select>
        </div>
        <div class="field"><label>Date</label>
          <input type="date" name="date" value="${todayISO()}">
        </div>
      </div>

      <div class="form-block-title"><span class="dot"></span>Personne</div>
      <div class="grid-3">
        <div class="field"><label>Nom</label><input type="text" name="nom" placeholder="KOUASSI" required></div>
        <div class="field"><label>Prénoms</label><input type="text" name="prenoms" placeholder="Jean" required></div>
        <div class="field"><label>Téléphone</label><input type="tel" name="telephone" placeholder="07 XX XX XX XX"></div>
      </div>
      <div class="grid-3">
        <div class="field">
          <label>Sexe</label>
          <div class="radio-row">
            <label class="chip-option"><input type="radio" name="sexe" value="M" checked> Homme</label>
            <label class="chip-option"><input type="radio" name="sexe" value="F"> Femme</label>
          </div>
        </div>
      </div>

      <div class="form-block-title"><span class="dot"></span>Identification</div>
      <div class="grid-3">
        <div class="field"><label>Type de pièce</label>
          <select name="typePiece">${TYPES_PIECES.map(t=>`<option>${t}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Numéro de pièce</label><input type="text" name="numeroPiece" placeholder="—"></div>
        <div class="field"><label>Situation carte CNU</label>
          <select name="cnuStatut">
            <option value="">—</option>
            <option>Dispose déjà de la carte</option>
            <option>A demandé la carte</option>
            <option>Ne dispose pas / non disponible</option>
          </select>
        </div>
      </div>

      <div class="form-block-title"><span class="dot"></span>Situation <span style="font-weight:400; text-transform:none; letter-spacing:0; color:var(--muted); font-family:var(--font-body); font-size:11.5px;">(plusieurs choix possibles)</span></div>
      <div class="check-grid">${situationChips}</div>

      <div class="form-block-title"><span class="dot"></span>Observation</div>
      <div class="field"><textarea name="observation" placeholder="Ex. Personne connue dans la communauté / vérification effectuée."></textarea></div>

      <div style="display:flex; gap:10px; margin-top:24px;">
        <button type="submit" class="btn btn-gold">Enregistrer la fiche</button>
        <button type="reset" class="btn btn-ghost">Effacer</button>
      </div>
    </form>
  </div>

  <div class="preview-card">
    <div class="section-head"><h2>Aperçu</h2><span class="hint">en direct</span></div>
    <div class="id-card-preview">
      <div class="idc-topband">CARTE D'ENRÔLEMENT &mdash; CNU</div>
      <div class="idc-body">
        <div class="idc-photo"></div>
        <div class="idc-fields">
          <div class="idc-field"><span class="arrow">&#8594;</span><b id="pvNomPrenoms">— —</b></div>
          <div class="idc-field"><span class="arrow">&#8594;</span><span id="pvLocaliteEquipe">Localité — Équipe</span></div>
          <div class="idc-field"><span class="arrow">&#8594;</span><span>Sexe : <b id="pvSexe">—</b></span></div>
          <div class="idc-field"><span class="arrow">&#8594;</span><span>Pièce : <b id="pvPiece">—</b></span></div>
          <div class="idc-field"><span class="arrow">&#8594;</span><span>N° pièce : <b id="pvNumero">—</b></span></div>
        </div>
      </div>
      <div class="idc-foot">
        <div class="idc-qr" title="Code / empreinte"></div>
        <div class="idc-badges" id="pvBadges"><span class="idc-pill idc-pill-empty">Aucune situation</span></div>
      </div>
    </div>
    <div class="preview-hint">Se remplit automatiquement pendant la saisie.</div>
  </div>
</div>
`;

function populateLocalites(){
  const spSelect = document.getElementById('spSelect');
  const localiteSelect = document.getElementById('localiteSelect');
  const sp = spSelect.value;
  const locs = LOCALITES_PAR_SP[sp] || [];
  localiteSelect.innerHTML = locs.map(l=>`<option>${l}</option>`).join('');
}
document.getElementById('spSelect').addEventListener('change', ()=>{ populateLocalites(); updatePreview(); });
populateLocalites();

function updatePreview(){
  const form = document.getElementById('ficheForm');
  const fd = new FormData(form);
  const nom = (fd.get('nom')||'').toUpperCase() || '—';
  const prenoms = fd.get('prenoms') || '—';
  document.getElementById('pvNomPrenoms').textContent = nom+' '+prenoms;
  document.getElementById('pvLocaliteEquipe').textContent = (fd.get('localite')||'—')+' ('+(fd.get('sousPrefecture')||'—')+') — '+(fd.get('equipe')||'—');
  document.getElementById('pvSexe').textContent = fd.get('sexe')==='F' ? 'Femme' : 'Homme';
  document.getElementById('pvPiece').textContent = fd.get('typePiece')||'—';
  document.getElementById('pvNumero').textContent = fd.get('numeroPiece') || '—';
  const situations = fd.getAll('situation');
  document.getElementById('pvBadges').innerHTML = situations.length
    ? situations.map(c=>`<span class="idc-pill">${c}</span>`).join('')
    : '<span class="idc-pill idc-pill-empty">Aucune situation</span>';
}
document.getElementById('ficheForm').addEventListener('input', updatePreview);
document.getElementById('ficheForm').addEventListener('change', updatePreview);
updatePreview();

document.getElementById('ficheForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const fd = new FormData(e.target);
  const situations = fd.getAll('situation');
  if(situations.length===0){
    showToast('Sélectionnez au moins une situation.');
    return;
  }
  const entry = {
    equipe: fd.get('equipe'), sousPrefecture: fd.get('sousPrefecture'), localite: fd.get('localite'), agent: fd.get('agent'),
    date: fd.get('date') || todayISO(),
    nom: fd.get('nom').toUpperCase(), prenoms: fd.get('prenoms'), sexe: fd.get('sexe'),
    telephone: fd.get('telephone'),
    typePiece: fd.get('typePiece'), numeroPiece: fd.get('numeroPiece'),
    cnuStatut: fd.get('cnuStatut'),
    situations, observation: fd.get('observation')||''
  };
  addPersonne(entry);
  showToast('Fiche enregistrée — '+entry.nom+' '+entry.prenoms);
  e.target.reset();
  e.target.querySelector('input[name=date]').value = todayISO();
  populateLocalites();
  updatePreview();
});
document.getElementById('ficheForm').addEventListener('reset', ()=>setTimeout(()=>{ populateLocalites(); updatePreview(); }));
</script>
</body>
</html>
